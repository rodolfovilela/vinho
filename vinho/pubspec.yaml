name: vinho
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  intl: any
  flutter_gen: ^5.12.0
  go_router: ^17.0.1
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.3
  responsive_framework: ^1.5.1
  flutter_form_builder: ^10.3.0+2

  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/images/mock/
