name: vinho
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  firebase_storage: ^13.2.0
  intl: any
  flutter_gen: ^5.12.0
  go_router: ^17.0.1
  cupertino_icons: ^1.0.8
  google_fonts: ^8.0.2
  responsive_framework: ^1.5.1
  flutter_form_builder: ^10.3.0+2
  percent_indicator: ^4.2.5
  flutter_widget_from_html: ^0.17.1
  cloud_functions: ^6.1.0
  device_info_plus: ^12.3.0
  url_launcher: ^6.3.1


  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/images/mock/
    - assets/icons/
